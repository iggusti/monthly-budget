<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#5b8a8a" />
		<meta name="description" content="Shared monthly budget for Nia and Ilham." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Nia & Ilham" />
		<title>Monthly Budget Nia Ilham</title>
		<script>
			// Apply the persisted theme before first paint to avoid a flash.
			(function () {
				try {
					var stored = localStorage.getItem("fhb-theme");
					var dark = stored === "dark" ||
						(!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.dataset.theme = dark ? "dark" : "light";
				} catch (e) {
					document.documentElement.dataset.theme = "light";
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
