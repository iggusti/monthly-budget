name: Setup and build
description: Checkout, install dependencies and build the static app with a CI app version.

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Resolve app version
      run: echo "APP_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
