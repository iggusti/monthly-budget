version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-check
          - "@sveltejs/*"
      firebase:
        patterns:
          - firebase
          - "@firebase/*"
      dev-tools:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - eslint
          - "@eslint/*"
          - typescript
          - typescript-eslint
          - sharp

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - functions
    commit-message:
      prefix: chore(functions)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(actions)
