<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8956c"/>
      <stop offset="0.55" stop-color="#c47070"/>
      <stop offset="1" stop-color="#5b8a8a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8956c"/>
      <stop offset="1" stop-color="#a07050"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background so the icon is safe in maskable (adaptive) shapes.
       The house artwork stays within the inner ~80% safe zone. -->
  <rect width="512" height="512" fill="#1a1714"/>

  <g transform="translate(256 256)">
    <!-- House body -->
    <rect x="-96" y="-20" width="192" height="130" rx="14" fill="url(#g)"/>
    <!-- Roof -->
    <path d="M-124 -8 L0 -118 L124 -8 Z" fill="url(#roof)"/>
    <!-- Door -->
    <rect x="-30" y="24" width="60" height="86" rx="10" fill="#faf9f7"/>
    <!-- Heart on the door -->
    <path d="M0 40c-4-6-13.6-5.6-16.8 0.8-3.2 6.4 2.4 11.2 16.8 19.2 14.4-8 20-12.8 16.8-19.2-3.2-6.4-12.8-6.8-16.8-0.8z" fill="#c47070"/>
  </g>
</svg>
